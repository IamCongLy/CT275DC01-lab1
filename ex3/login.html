<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - Biểu mẫu đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <style>
        .form-header {
            background-color: #d9edf7;
            color: #31708f;
            padding: 10px 15px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            font-weight: bold;
        }
        .form-header-blue {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            font-weight: bold;
        }
        .custom-card {
            border: 1px solid #bce8f1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 bg-light">
    <div class="container" style="max-width: 800px;">
        <div class="card custom-card mb-5">
            <div class="form-header">Biểu mẫu đăng nhập</div>
            <div class="card-body p-4">
                <form>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label text-sm-end fw-bold">Email:</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" placeholder="Nhập vào email">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label text-sm-end fw-bold">Mật khẩu:</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-8 offset-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember1">
                                <label class="form-check-label" for="remember1">Ghi nhớ tôi</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-8 offset-sm-3">
                            <button type="submit" class="btn btn-primary px-3">Đăng nhập</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card custom-card mb-5">
            <div class="form-header">Biểu mẫu đăng nhập</div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email:</label>
                        <input type="email" class="form-control" placeholder="Nhập vào email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password:</label>
                        <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
                    </div>
                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="remember2">
                        <label class="form-check-label" for="remember2">Ghi nhớ tôi</label>
                    </div>
                    <button type="submit" class="btn btn-primary px-3">Đăng nhập</button>
                </form>
            </div>
        </div>
        <div class="card border-0 mb-5">
            <div class="form-header-blue">Biểu mẫu đăng nhập</div>
            <div class="card-body p-3 bg-white border border-top-0 rounded-bottom">
                <form class="row row-cols-lg-auto g-2 align-items-center">
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user text-secondary"></i></span>
                            <input type="email" class="form-control" placeholder="Nhập vào email">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock text-secondary"></i></span>
                            <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember3">
                            <label class="form-check-label small" for="remember3">Ghi nhớ tôi</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-sm px-3">Đăng nhập</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center my-5 p-4 bg-white rounded border">
            <h3 class="mb-3 fw-normal">Mở biểu mẫu đăng nhập</h3>
            <button type="button" class="btn btn-info text-white px-4 py-2 fs-5" data-bs-toggle="modal" data-bs-target="#loginModal">
                Mở hộp thoại
            </button>
        </div>

        <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header justify-content-center position-relative">
                        <h4 class="modal-title fw-bold text-dark">
                            <i class="fas fa-lock me-2"></i>Đăng nhập
                        </h4>
                        <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-user me-2"></i>Người dùng:</label>
                                <input type="text" class="form-control" placeholder="Nhập tên người dùng">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fas fa-eye me-2"></i>Mật khẩu:</label>
                                <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                            </div>
                            <div class="mb-3 form-check">
                                <input class="form-check-input" type="checkbox" id="rememberModal">
                                <label class="form-check-label" for="rememberModal">Ghi nhớ tôi</label>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 mb-3 fs-5">
                                <i class="fas fa-power-off me-2"></i>Đăng nhập
                            </button>
                        </form>
                    </div>
                    <div class="modal-footer d-flex justify-content-between align-items-center">
                        <button type="button" class="btn btn-danger px-3" data-bs-dismiss="modal">
                            <i class="fas fa-times me-1"></i> Hủy bỏ
                        </button>
                        <div class="text-end small">
                            <div>Bạn chưa phải là thành viên? <a href="#" class="text-decoration-none">Đăng ký</a></div>
                            <div><a href="#" class="text-decoration-none">Quên mật khẩu?</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
